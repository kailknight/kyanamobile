; Google Play WCoin (C) recharge (PlayBilling.cpp).
; Needs PlayBilling_Schema.sql run once on the database.

[PlayBilling]
; 0 = off: the phone's Pay still works but nothing is credited (reported as "not available").
Enabled = 1
; The Google Cloud service account key (JSON) with Play Console access to the app.
; Keep this file private. A changed key or package needs a DataServer restart.
KeyFile = .\PlayBilling.json
PackageName = com.worldofkira

; WCoin (C) added per Play product id, bonus included.
; Must match the products in Play Console (Monetise > One-time products).
[Products]
wcoin_c_20 = 20
wcoin_c_110 = 110
wcoin_c_320 = 320
wcoin_c_540 = 540
wcoin_c_1100 = 1100
wcoin_c_2750 = 2750

; App Store (iPhone/iPad) WCoin (C) recharge. Same [Products] ids and amounts.
[AppStore]
; 0 = off: iPhone purchases are kept unfinished on the phone and credited once this is on.
Enabled = 0
; App Store Connect > Users and Access > Integrations > In-App Purchase: the .p8
; key file, its Key ID, and the Issuer ID shown on that page. Keep the .p8 private.
KeyFile = .\AppStoreKey.p8
KeyId =
IssuerId =
BundleId = com.worldofkira
; 1 = also credit sandbox purchases (TestFlight, Xcode). Those cost the tester
; nothing, so leave this 0 on the live server.
AllowSandbox = 0
; Accounts whose sandbox purchases are credited even with AllowSandbox = 0:
; Apple's reviewer buys in the sandbox with the demo account from App Review
; Information, so list it here. Comma separated.
SandboxAccounts = test2
