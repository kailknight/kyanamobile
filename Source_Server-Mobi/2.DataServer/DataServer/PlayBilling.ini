; Google Play WCoin (C) recharge (PlayBilling.cpp).
; Needs PlayBilling_Schema.sql run once on the database.

[PlayBilling]
; 0 = off: the phone's Pay still works but nothing is credited (reported as "not available").
Enabled = 1
; The Google Cloud service account key (JSON) with Play Console access to the app.
; Keep this file private. A changed key or package needs a DataServer restart.
KeyFile = .\PlayBilling.json
PackageName = com.worldofkira

; WCoin (C) added per Play product id, bonus included.
; Must match the products in Play Console (Monetise > One-time products).
[Products]
wcoin_c_20 = 20
wcoin_c_110 = 110
wcoin_c_320 = 320
wcoin_c_540 = 540
wcoin_c_1100 = 1100
wcoin_c_2750 = 2750
