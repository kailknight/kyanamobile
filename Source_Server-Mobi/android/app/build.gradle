plugins {
    id 'com.android.application'
}

import java.nio.ByteBuffer
import java.nio.ByteOrder
import java.util.Locale
import java.util.Properties

// Release signing: credentials live in keystore/keystore.properties (not
// committed - the whole android/ folder is gitignored already), not inlined
// here, so a real signing key never ends up in a diff or a build log.
def keystorePropsFile = rootProject.file("keystore/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def requiredNativeLibs = [
    "libSDL2.so",
    "libSDL2_image.so",
    "libSDL2_mixer.so",
    "libSDL2_ttf.so",
    "libSDL_net.so",
    "libbotan.so",
    "libmpg123.so",
]

def preferredAbis = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]

def abiPresence = preferredAbis.collectEntries { abi ->
    def abiDir = file("src/main/jniLibs/${abi}")
    def missingLibs = requiredNativeLibs.findAll { libName ->
        !file("src/main/jniLibs/${abi}/${libName}").exists()
    }

    [abi, [
        hasAllRequiredLibs: abiDir.exists() && abiDir.isDirectory() && missingLibs.isEmpty(),
        missingLibs: missingLibs,
    ]]
}

def detectedJniAbis = preferredAbis.findAll { abi -> abiPresence[abi].hasAllRequiredLibs }

def requestedRequiredAbis = (project.findProperty("muRequiredAbis") ?: "")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

def requestedRealDeviceAbis = (project.findProperty("muRealDeviceAbis") ?: "")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

def requestedEmulatorAbis = (project.findProperty("muEmulatorAbis") ?: "")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

def requestedUniversalAbis = (project.findProperty("muUniversalAbis") ?: "")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }

def failOnMissingRequiredAbis = (project.findProperty("muFailOnMissingRequiredAbis") ?: "false")
    .toString()
    .toBoolean()

def muEnableLogs = (project.findProperty("muEnableLogs") ?: "false")
    .toString()
    .toBoolean()

def muPerfLogs = (project.findProperty("muPerfLogs") ?: "false")
    .toString()
    .toBoolean()

// -PmuDiag=true turns on the developer diagnostics in a RELEASE build: the
// drift log (one line every 10 s: fps, frame buckets, draw counts) and the
// other file probes, with no on-screen overlay. For measuring a build that is
// otherwise identical to what ships. Never enable for a build you hand out.
def muDiag = (project.findProperty("muDiag") ?: "false")
    .toString()
    .toBoolean()

def muEnableBgfx = (project.findProperty("muEnableBgfx") ?: "false")
    .toString()
    .toBoolean()

def muNativeCppFlags = "-std=c++20 -D__ANDROID__ -DANDROID " +
                       "-DNDEBUG " +
                       "-Wno-error -Wno-unknown-pragmas " +
                       "-fexceptions -frtti" +
                       (muEnableLogs ? " -DMU_ANDROID_VERBOSE_NET_LOG" : " -DMU_ANDROID_DISABLE_LOG") +
                       (muPerfLogs ? " -DMU_ANDROID_PERF_LOG" : "") +
                       (muDiag ? " -DMU_DEV_DIAGNOSTICS=1" : "")

def missingRequestedAbis = requestedRequiredAbis.findAll { abi ->
    !abiPresence.containsKey(abi) || !abiPresence[abi].hasAllRequiredLibs
}

if (!requestedRequiredAbis.isEmpty()) {
    def requestedDetectedAbis = requestedRequiredAbis.findAll { abi ->
        abiPresence.containsKey(abi) && abiPresence[abi].hasAllRequiredLibs
    }
    if (!requestedDetectedAbis.isEmpty()) {
        detectedJniAbis = requestedDetectedAbis
    }
}

if (detectedJniAbis.isEmpty()) {
    detectedJniAbis = ["armeabi-v7a"]
}

if (!missingRequestedAbis.isEmpty()) {
    println("TakumiMu missing native ABIs: ${missingRequestedAbis.join(', ')}")
    missingRequestedAbis.each { abi ->
        def missing = abiPresence.containsKey(abi) ? abiPresence[abi].missingLibs : requiredNativeLibs
        println("  - ${abi}: missing ${missing.join(', ')}")
    }

    if (failOnMissingRequiredAbis) {
        throw new GradleException(
            "Missing required ABIs (${missingRequestedAbis.join(', ')}). " +
            "Populate src/main/jniLibs/<abi>/ with: ${requiredNativeLibs.join(', ')}")
    }
}

println("TakumiMu native ABIs: ${detectedJniAbis.join(', ')}")

def defaultRealDeviceAbis = ["armeabi-v7a", "arm64-v8a"]
def defaultEmulatorAbis = ["x86", "x86_64"]
def realDeviceAbis = requestedRealDeviceAbis.isEmpty() ? defaultRealDeviceAbis : requestedRealDeviceAbis
def emulatorAbis = requestedEmulatorAbis.isEmpty() ? defaultEmulatorAbis : requestedEmulatorAbis
def universalAbis = requestedUniversalAbis.isEmpty() ? detectedJniAbis : requestedUniversalAbis

println("TakumiMu real-device ABIs: ${realDeviceAbis.join(', ')}")
println("TakumiMu emulator ABIs: ${emulatorAbis.join(', ')}")
println("TakumiMu universal ABIs: ${universalAbis.join(', ')}")

def toVariantDirName = { String variant ->
    if (variant == null || variant.isEmpty()) {
        return variant
    }
    return variant.substring(0, 1).toLowerCase(Locale.ROOT) + variant.substring(1)
}

def patchElfLoadAlignment16k = { File soFile ->
    byte[] data = soFile.bytes
    if (data.length < 64) {
        return false
    }

    if (!(data[0] == (byte) 0x7f && data[1] == (byte) 0x45 && data[2] == (byte) 0x4c && data[3] == (byte) 0x46)) {
        return false
    }

    final int eiClass = data[4] & 0xFF
    final int eiData = data[5] & 0xFF
    if (eiClass != 1 && eiClass != 2) {
        return false
    }

    final ByteBuffer buffer = ByteBuffer.wrap(data)
    buffer.order(eiData == 2 ? ByteOrder.BIG_ENDIAN : ByteOrder.LITTLE_ENDIAN)

    def readU16 = { int offset ->
        buffer.getShort(offset) & 0xFFFF
    }
    def readU32 = { int offset ->
        buffer.getInt(offset) & 0xFFFFFFFFL
    }
    def readU64 = { int offset ->
        buffer.getLong(offset)
    }
    def writeU32 = { int offset, long value ->
        buffer.putInt(offset, (int) (value & 0xFFFFFFFFL))
    }
    def writeU64 = { int offset, long value ->
        buffer.putLong(offset, value)
    }

    final long targetAlign = 16384L
    final long ePhOff
    final int ePhEntSize
    final int ePhNum
    final int pAlignOffset
    final int pOffsetOffset
    final int pVaddrOffset

    if (eiClass == 2) {
        ePhOff = readU64(32)
        ePhEntSize = readU16(54)
        ePhNum = readU16(56)
        pAlignOffset = 48
        pOffsetOffset = 8
        pVaddrOffset = 16
    } else {
        ePhOff = readU32(28)
        ePhEntSize = readU16(42)
        ePhNum = readU16(44)
        pAlignOffset = 28
        pOffsetOffset = 4
        pVaddrOffset = 8
    }

    if (ePhOff <= 0 || ePhEntSize <= 0 || ePhNum <= 0) {
        return false
    }

    boolean patched = false
    for (int i = 0; i < ePhNum; i++) {
        long phdrOffLong = ePhOff + ((long) i * ePhEntSize)
        if (phdrOffLong < 0 || phdrOffLong + ePhEntSize > data.length) {
            break
        }

        int phdrOff = (int) phdrOffLong
        long pType = readU32(phdrOff)
        if (pType != 1L) {
            continue
        }

        long pOffset = eiClass == 2 ? readU64(phdrOff + pOffsetOffset) : readU32(phdrOff + pOffsetOffset)
        long pVaddr = eiClass == 2 ? readU64(phdrOff + pVaddrOffset) : readU32(phdrOff + pVaddrOffset)
        int alignOff = phdrOff + pAlignOffset
        long pAlign = eiClass == 2 ? readU64(alignOff) : readU32(alignOff)

        if (pAlign >= targetAlign) {
            if (pAlign != 0 && (pOffset % pAlign) != (pVaddr % pAlign)) {
                throw new GradleException(
                    "Invalid native alignment in ${soFile}: PT_LOAD #${i} has " +
                    "p_offset=0x${Long.toHexString(pOffset)}, " +
                    "p_vaddr=0x${Long.toHexString(pVaddr)}, " +
                    "p_align=0x${Long.toHexString(pAlign)}")
            }
            continue
        }

        if ((pOffset % targetAlign) != (pVaddr % targetAlign)) {
            throw new GradleException(
                "Unsafe 16KB patch for ${soFile}: PT_LOAD #${i} has " +
                "p_offset=0x${Long.toHexString(pOffset)}, " +
                "p_vaddr=0x${Long.toHexString(pVaddr)}. " +
                "Rebuild this library with -Wl,-z,max-page-size=16384 instead of header patching.")
        }

        if (eiClass == 2) {
            writeU64(alignOff, targetAlign)
        } else {
            writeU32(alignOff, targetAlign)
        }
        patched = true
    }

    if (patched) {
        soFile.bytes = data
    }
    return patched
}

def patchNativeDirTo16k = { File dir, String label ->
    if (!dir.exists()) {
        return
    }

    int scanned = 0
    int patched = 0
    fileTree(dir) {
        include '**/*.so'
    }.files.each { File soFile ->
        def abiName = soFile.parentFile?.name
        if (!(abiName in ['arm64-v8a', 'x86_64'])) {
            return
        }
        scanned++
        if (patchElfLoadAlignment16k(soFile)) {
            patched++
        }
    }

    if (patched > 0) {
        println("TakumiMu 16KB patch: ${patched}/${scanned} file(s) in ${label}")
    }
}

android {
    // Deliberately NOT changed to match applicationId below: this is the
    // Java source package (app/src/main/java/com/muonline/client/*.java -
    // the actual package declaration inside those files), which Android
    // fully allows to differ from applicationId. Renaming it would mean
    // moving every Java file to a new folder and updating its package
    // statement, for a namespace nothing outside this module reads.
    namespace 'com.muonline.client'
    compileSdk 36

    flavorDimensions 'target'

    defaultConfig {
        // This is the Play Store / installed-package identity - Android
        // scopes each app's private storage (/sdcard/Android/data/<this>/...,
        // /data/data/<this>/...) to it at install time, which is why the
        // native-code path constants below had to change to match (see
        // android_main.cpp, Platform/AndroidGDI.cpp, Platform/MobilePlatform.cpp).
        applicationId "com.worldofkira"
        minSdk 24          // Android 7.0 - Play automatic protection requires 24+; covers Sony SO-02L (API 28)
        targetSdk 36
        // Bumped 11 -> 12. Verify this is still higher than the max versionCode
        // present on ANY Play Console release/draft (including abandoned ones)
        // before uploading, or the "doesn't allow existing users to upgrade"
        // rollout error will recur.
        //
        // History: 9 never shipped a release artifact - only a debug APK
        // (2026-09-10) - and the last release APK was 8 (2026-09-08). 10 was
        // used for the universal release AAB built 2026-09-12. 11 was built as a
        // universal release AAB the same day (2026-09-12) and burned before
        // upload - Play Console already had a release/draft at that code - so 12
        // is the first code free for upload.
        //
        // 11 carried, on top of 10:
        //   - spin wheel rework and claim box
        //   - fixed minimap; chat surviving trade/NPC windows (drag-to-scroll,
        //     one-tap open)
        //   - character-select stale-tap and Connect/Delete fixes; legacy-button
        //     tap debounce
        //   - cash shop banner flip; craft-box hold-to-move
        //   - warehouse hold-to-move (the withdraw direction could never arm)
        //   - drop item names keep their rarity colour (GL_CURRENT_COLOR is not
        //     a GLES3 query, so the colour was written and never read back)
        //   - saved-account list selects the row you tap (hit boxes were sized in
        //     window units but compared in 640x480 space, so one box covered ~3
        //     rows)
        //   - player names show without tapping (g_bGMObservation was never
        //     seeded from mShowName on this platform)
        //   - registration reports success and failure (its message box is only
        //     painted by main-scene UI, so nothing drew it on the login screen,
        //     and the undismissable box then muted every later message)
        //   - buff skills land on the aimed player instead of always self
        //   - MainInfo HidePlayerMenu mask; CustomCashShop honoured again
        //   - containment guard for the garbage OBJECT::Owner crash
        //
        // NOT in 11, despite being in some 2026-09-12 debug APKs: the 576p
        // render target. It was reverted - fixing an absolute render height to
        // 576 raised logical text width ~35% and clipped login labels, because
        // font size is only weakly tied to render height while g_fScreenRate is
        // proportional to it. Back to the fractional 0.75 scale.
        //
        // 12 carries, on top of 11 (2026-09-13, cash shop buy-dialog text path):
        //   - package descriptions saved with real CR/LF (not '#') normalised
        //     before wrapping, so they no longer draw as one run with notdef
        //     glyphs where the line breaks were (IGSNormalizeShopText)
        //   - buy-select dialog: modern-skin description lines drawn on their
        //     real 13px pitch and clamped to 3 lines, with the attribute/duration
        //     plates resized so they no longer overlap or run under the list
        //   - DivideStringByPixel's internal 1KB copy bounded with strncpy - a
        //     long package description could overrun it (was a bare strcpy)
        //   - CUIBuyingListBox::LINE_TEXTMAX widened to MAX_TEXT_LENGTH+1 and its
        //     strncpy terminated explicitly - the old 64-byte limit was shorter
        //     than lines its own caller produces, so a full line left no room for
        //     a terminator and the render read on into the next list node
        //   - CUIBuyingListBox::RenderDataLine now clips to box width - with no
        //     width it did not clip, so an unbroken long line drew past the
        //     dialog edge
        //   - Android: modal message-box handling moved back ahead of the
        //     register-overlay tap handler, so a registration validation error
        //     (empty field, ID taken, ...) is dismissable instead of eating taps
        //     meant for the message box's OK button
        //
        // 13 carries, on top of 12 (2026-09-13, cash shop variants and gifting):
        //   - variant dialog shows each duration's own price - the server price
        //     was looked up by ProductSeq, which all variants share, so every row
        //     showed the first variant's price while the buy charged the right one
        //   - gifting works - the 0xD2:0x04 send omitted the MileageFlag byte, so
        //     the server read the recipient name one byte shifted ("not found")
        //   - gift dialog text readable on the modern skin (was black on dark)
        //   - PC-only cash shop banner orientation fix is also in this source,
        //     but the mobile draw path is unchanged
        //
        // 14 carries, on top of 13 (2026-09-14):
        //   - registration 7-digit PIN optional via MainInfo RegisterPinCode;
        //     tail offsets moved +4, with the previous CBGetMain.bin size still
        //     recognised so un-updated data.zip installs keep CustomCashShop
        //   - Loren Deep siege map docked top right, minimap panel stands down
        //     there, and the map texture is no longer upside down
        //   - HP/MP/SD/AG/EXP bars narrowed (188 -> 102), Helper/Play follow,
        //     bar numbers outlined
        //   - skill slots ringed while a picked skill waits to be placed
        //   - gift dialog OK/Cancel kept above the soft keyboard and tappable
        //   - mastered skill icons drawn round in the skill ring
        //
        // 15 (2026-09-15): Play Console rejected an upload of the stale v12
        // AAB still sitting in Working Project\APK, so skip past 13/14 to be
        // safe. Adds the SD boost aura no longer lingering after its owner dies.
        // 16 (2026-09-18): a WorldOfKira-1.0.15-release.apk already exists in
        // Working Project\APK, so 15 may well be spoken for on the Console -
        // bumped rather than risk another stale-version rejection. Carries:
        //   - CMB combo no longer skips a step: the chain advances only when a
        //     skill request actually reaches the wire, not on ExecuteSkill's
        //     return value, which reports the PREVIOUS cast
        //   - a second finger on the attack button no longer double-advances it
        //   - the game keeps running (muted) in a floating window instead of
        //     freezing when it loses focus; sensorLandscape follows the phone
        //   - Muun collector skips drops the server refused instead of
        //     re-asking every second - the "does not belong to you" spam
        //   - Chaos Machine: talisman bonus no longer double-counted in the
        //     displayed rate (showed 100% on a mix the server rolled at 53%),
        //     talismans excluded from ingredient matching, cap shown in the
        //     window, and real messages on the two refusal cases
        // NOTE: the mix-info packet gained 4 bytes - needs the 2026-09-18
        // GameServer build or the ingredient list misparses.
        // 17 (2026-09-19): proximity voice chat. Off unless the server enables
        // it (CustomConfig.ini VoiceChatEnable, 0 by default), so this ships
        // inert until a GameServer with the voice feed is deployed. Carries:
        //   - UDP voice client, IMA ADPCM at 8kHz, per-speaker jitter buffers
        //     and distance attenuation computed server-side
        //   - capture/playback over OpenSL ES, NOT SDL: SDL's audio is
        //     unreachable in this app (SDL_main is #if 0'd and the SDLActivity
        //     subclass never launches), so its Java bootstrap never runs
        //   - echo cancellation via the VOICE_COMMUNICATION recording preset,
        //     which is what stops the microphone picking up the game's own
        //     audio out of the speaker. The default GENERIC preset is for
        //     recording music and bypasses the device's AEC entirely.
        //   - noise gate with a learned floor, and automatic input levelling
        //     before encoding - 4 bits per sample leaves no room for a quiet
        //     signal
        //   - RECORD_AUDIO declared, asked for at the first attempt to talk
        //     rather than at startup; the request is async so that first press
        //     falls back to a test tone
        //   - mic button beside Helper, toggle not hold, starting muted every
        //     session and never persisted
        // NOTE: no audio has been heard through this yet. The codec, the relay
        // and the PC audio format have tests under 7.VoiceServer\Test, but
        // nothing has run end to end inside the client.
        // 19 (2026-09-22): Elf bow skills. 18 was skipped - a "1.0.18" debug
        // APK was only a renamed 17 build. Carries:
        //   - Triple Shot fires and hits at high attack speed, no longer needs
        //     Five Shot cast first, and hits players (target key was stale)
        //   - Triple Shot: 3 arrows, 4 only with Triple Shot Mastery; the old
        //     4-arrow rule for BOW+18/19/22/23/24 is gone
        //   - Penetration charges, releases, and its charge scales with
        //     attack speed
        // NOTE: Triple Shot damage is now resolved by the GameServer
        // (SkillTripleShot) - needs the 2026-09-22 GameServer build or it
        // stops hitting.
        // 20 (2026-09-24). Built from the uncommitted working tree - nothing
        // since 19 is committed. Carries, on top of 19:
        //   - Samsung / resized-surface login screen: the engine size is now
        //     locked once the game starts (a later surface change only rescales
        //     the final blit), startup waits for the surface to settle, and
        //     resize events no longer apply the unscaled physical size; plus the
        //     font-DIB pitch fix (text was rows of dots), CSprite re-anchoring,
        //     proportional UI font and 1:1 rendering on surfaces <= 800px tall
        //   - fast typing no longer drops letters (the IME bridge restarted the
        //     keyboard connection after every character) and composing keyboards
        //     no longer double text
        //   - registration: repeat taps while a request is out are ignored
        //     instead of showing "Thao tac cham lai"; no-reply and unknown
        //     results are reported; messages in English
        //   - AutoPots button beside skill slot 3: tap = auto potion on/off,
        //     hold = settings (threshold rules from the server)
        // NOTE: auto potion rules come in 0xD3:0x7E - needs the 2026-09-24
        // GameServer, otherwise the old "VIP may change it, else 30%" applies.
        // 21 (2026-09-24). Mobile performance for low-end devices. Carries,
        // on top of 20:
        //   - character/monster drawing re-sends far less GL state per draw:
        //     uniforms only when they change, one VAO per mesh instead of
        //     re-specifying attribute pointers, bone matrices uploaded only
        //     when they actually differ, and a character draw no longer
        //     invalidates cached state it never touched. No visual change.
        //   - measurement switches that do nothing unless a mu_gl_ab.txt is
        //     placed in the app's data folder by hand (draw-path A/B), plus the
        //     GPU name and chosen draw path recorded at startup.
        // Measured on the emulator: 23-26 players cost 15-22 ms of a 38 ms
        // frame in character rendering with the GPU idle, so this targets the
        // CPU-side cost that dominates weak devices.
        // KNOWN, NOT YET FIXED: opening the inventory costs ~5x the frame time
        // (emulator 23 -> 4.2 FPS) because every item icon re-renders a 3D
        // model each frame. Suspected cause of the ~8 FPS Samsung A12 reports,
        // whose screenshots were taken with that window open.
        // 22 (2026-09-25). Carries, on top of 21:
        //   - Mali GPUs (Helio G99 / Mali-G57): other players no longer explode
        //     into screen-sized triangles over black terrain; per-mesh VAOs are
        //     Adreno-only now
        //   - other players' effects are lighter on mobile (hero, target and
        //     selected character stay full)
        //   - PK mode: aims at a player first and keeps that target; Wizard AOE
        //     skills hit players; with PK mode off an AIM-locked player is no
        //     longer attacked
        //   - Death Stab no longer drops FPS (effects spawned per rendered
        //     frame instead of at the 25 FPS reference rate)
        //   - damage numbers: orange normal, red incoming, blue critical, green
        //     excellent, cyan ignore defense, pink reflect, yellow SD, light
        //     green poison/DOT, white double damage
        // Death Stab and damage colours are from the uncommitted working tree.
        // 25 (2026-10-01): Fire Slash hits players several times on mobile
        // (the swing effect kept the PvP target key), and the hero's own skill
        // effects are never dropped by the adaptive effect throttle.
        // 26 (2026-10-01): Summoner Weakness/Innovation send the aimed target,
        // so they debuff players in normal PvP (needs the matching GameServer).
        // 27 (2026-10-04): item pick-up menu details stay inside their box, no longer
        // sway, stay open while paging and keep taps off the inventory behind them;
        // auto potion finds potions in expanded inventory pages; a finished duel
        // clears the target system; chat typing no longer drops fast keystrokes;
        // combo ms per step limited to 200-600 (same as PC auto combo); tapping
        // Settings, Jewel Bank or any custom window no longer walks the character;
        // master skill tree lights the next best pick with "PICK +N" (steps of 10,
        // from the top 20 characters of the class, min 5, hidden with no points;
        // needs the matching GameServer and DataServer, packet C1:D3:B9); duel kills
        // show a big fading score in the middle, the corner score box is gone; the
        // preload screen shows error codes, never the server address; reset window
        // redesign (keep stats, reward, on spot). Local test builds 28-37 of the
        // same day were folded into this version.
        versionCode 27
        versionName "1.0.27"

        // A diagnostics build can be CPU-profiled with simpleperf without
        // being debuggable (which would change its performance).
        manifestPlaceholders = [muProfileable: muDiag ? "true" : "false"]

        externalNativeBuild {
            cmake {
                // C++20, Android platform defines, disable editor/dotnet
                cppFlags muNativeCppFlags
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-24",
                          "-DMU_ENABLE_BGFX=" + (muEnableBgfx ? "ON" : "OFF"),
                          // Handed to native code so the build number the client
                          // reports to the GameServer (ClientBuild.h, packet
                          // 0xD3:0x7D) IS this APK's versionCode, rather than a
                          // constant somebody has to remember to bump twice.
                          // The outdated-client gate compares against it, so a
                          // drift between the two would block the wrong builds.
                          "-DMU_ANDROID_VERSION_CODE=" + defaultConfig.versionCode
            }
        }

        // ABI filters are selected by product flavor below.
    }

    productFlavors {
        realDevice {
            dimension 'target'
            ndk {
                abiFilters(*realDeviceAbis)
            }
            buildConfigField "String", "TARGET_PROFILE", '"realDevice"'
        }

        emulator {
            dimension 'target'
            ndk {
                abiFilters(*emulatorAbis)
            }
            buildConfigField "String", "TARGET_PROFILE", '"emulator"'
        }

        universal {
            dimension 'target'
            ndk {
                abiFilters(*universalAbis)
            }
            buildConfigField "String", "TARGET_PROFILE", '"universal"'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file("keystore/" + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            buildConfigField "boolean", "ENABLE_LOGS", muEnableLogs ? "true" : "false"
        }
        release {
            // See proguard-rules.pro's header comment: com.muonline.client.*
            // and org.libsdl.app.* are kept wholesale because native code
            // resolves their methods by string name over JNI, not by a
            // compile-time-checked reference R8 could trace - shrinking is
            // still real here (resources + the androidx.appcompat
            // dependency), it just can't touch this project's own two Java
            // packages.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            buildConfigField "boolean", "ENABLE_LOGS", muEnableLogs ? "true" : "false"
            ndk {
                // Play Console's "native debug symbols" warning: package the
                // symbol table (not the much larger FULL debug info) so
                // Play can symbolicate native crash/ANR stack traces.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    sourceSets {
        main {
            // prebuilt .so libraries from APK reference
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Game assets (Data folder)
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        // Don't strip debug symbols during development
        jniLibs.keepDebugSymbols += ['**/*.so']
        // minSdk 24 would otherwise store the .so files uncompressed (the APK
        // went 56 MB -> 179 MB). Keep them compressed and extracted at
        // install, as they were under minSdk 21.
        jniLibs.useLegacyPackaging = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

tasks.matching { it.name ==~ /merge.+NativeLibs/ }.configureEach { Task task ->
    task.doLast {
        def matcher = (task.name =~ /merge(.+)NativeLibs/)
        if (!matcher.matches()) {
            return
        }
        String variantName = toVariantDirName(matcher.group(1))
        patchNativeDirTo16k(
            file("${buildDir}/intermediates/merged_native_libs/${variantName}/out/lib"),
            "merged_native_libs/${variantName}/out/lib")
    }
}

tasks.matching { it.name ==~ /strip.+DebugSymbols/ }.configureEach { Task task ->
    task.doLast {
        def matcher = (task.name =~ /strip(.+)DebugSymbols/)
        if (!matcher.matches()) {
            return
        }
        String variantName = toVariantDirName(matcher.group(1))
        patchNativeDirTo16k(
            file("${buildDir}/intermediates/stripped_native_libs/${variantName}/out/lib"),
            "stripped_native_libs/${variantName}/out/lib")
    }
}

tasks.register('patchSourceJniLibs16k') {
    doLast {
        patchNativeDirTo16k(
            file('src/main/jniLibs'),
            'src/main/jniLibs')
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach { Task task ->
    task.dependsOn('patchSourceJniLibs16k')
}


